name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ECommerce.sln

      - name: Build
        run: dotnet build ECommerce.sln --no-restore -c Release

      # GATE-002 — DAT-002: no foreign key crosses a schema boundary
      - name: Cross-schema foreign key scan
        run: ./scripts/check-migrations.sh src

      # GATE-003 — MSG-003: a breaking event schema change ships as a new version, and the
      # previous version keeps being published until every consumer has migrated.
      - name: Event schema compatibility
        run: ./scripts/check-schema-compatibility.sh origin/main

      # SPC-001 — a specification names behaviour, never a technology
      - name: Specification keyword scan
        run: ./scripts/check-spec-keywords.sh

      # DEP-001 — every deployable has a Dockerfile that builds itself
      - name: Deployable image check
        run: ./scripts/check-deployable-images.sh src

      # STK-001 — the Technology Constraints stack is closed
      - name: Approved package check
        run: ./scripts/check-approved-packages.sh

      # DAT-006 — raw SQL must not reference another module's schema
      - name: Cross-schema SQL scan
        run: ./scripts/check-sql-schemas.sh src

      # GATE-001 — every named check runs and blocks the merge
      - name: Test
        run: dotnet test ECommerce.sln --no-build -c Release --logger "trx;LogFileName=test.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  # DEP-002 — the backend image MUST be independently buildable: this job is given the source
  # tree and nothing else. It installs no .NET SDK and runs no dotnet command on the runner, so
  # a green result proves the image builds itself (DEP-001) without the other deployable's
  # toolchain (DEP-002).
  backend-image:
    runs-on: ubuntu-latest

    # The image requires PostgreSQL: DEP-001 makes it apply its own migrations at start-up, so a
    # smoke test without a database would be testing the wrong thing -- it would prove only that
    # the process exits. DEP-002 is about not needing the OTHER DEPLOYABLE's toolchain, which
    # this does not; no .NET SDK and no frontend source are present in this job.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the backend image in isolation
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Host/ECommerce.Host/Dockerfile
          push: false
          load: true
          tags: ecommerce-host:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image starts, migrates itself and reports readiness
        run: |
          docker run -d --name catalog --network host \
            -e 'ConnectionStrings__Catalog=Host=localhost;Database=ecommerce;Username=ecommerce;Password=ecommerce' \
            ecommerce-host:ci
          # Two separate signals, and the job asserts BOTH.
          #
          # Readiness proves the image migrated an empty database itself (DEP-001).
          # Docker HEALTH proves the HEALTHCHECK actually works -- the previous version of this
          # job asserted readiness only, so it passed for some time with a HEALTHCHECK that could
          # never succeed: the runtime image had no wget, every probe failed, and the container
          # reported `unhealthy` while serving 200s. Anything reading Docker health was acting on
          # a permanently false signal.
          ready=""
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/health/ready >/dev/null 2>&1; then
              ready="yes"
              echo "readiness OK -- the image migrated an empty database itself"
              docker logs catalog 2>&1 | grep -i "Applying .* pending migration" || true
              break
            fi
            sleep 2
          done

          if [ -z "$ready" ]; then
            echo "the image did not report readiness within 80s"
            docker logs catalog
            docker rm -f catalog
            exit 1
          fi

          for i in $(seq 1 30); do
            health="$(docker inspect -f '{{.State.Health.Status}}' catalog)"
            echo "docker health: $health"
            if [ "$health" = "healthy" ]; then
              docker rm -f catalog
              exit 0
            fi
            if [ "$health" = "unhealthy" ]; then
              echo "the HEALTHCHECK is failing. Last probe output:"
              docker inspect -f '{{range .State.Health.Log}}{{.Output}}{{end}}' catalog
              docker rm -f catalog
              exit 1
            fi
            sleep 3
          done

          echo "the container never reached a healthy state"
          docker inspect -f '{{range .State.Health.Log}}{{.Output}}{{end}}' catalog
          docker rm -f catalog
          exit 1
